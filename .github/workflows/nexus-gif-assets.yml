name: Generate original NEXUS transparent GIFs

on:
  workflow_dispatch:
  push:
    branches: ["work/nexus-v2.1-shell-assets"]
    paths:
      - "tools/generate_nexus_gifs.py"
      - ".github/workflows/nexus-gif-assets.yml"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/nexus-v2.1-shell-assets
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install 'Pillow>=10,<13'
      - run: python tools/generate_nexus_gifs.py
      - name: Commit generated GIFs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/Generated/Animations
          if ! git diff --cached --quiet; then
            git commit -m 'assets: generate 12 original transparent NEXUS GIF animations'
            git push origin HEAD:work/nexus-v2.1-shell-assets
          fi
