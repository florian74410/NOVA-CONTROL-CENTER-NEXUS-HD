name: NEXUS V2 Qt smoke

on:
  push:
    branches: ["work/nexus-v2-renderer"]
  pull_request:

jobs:
  qt-renderer:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install and verify Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          python -m compileall -q src tests
      - name: V2 test
        run: |
          python -m pytest -q tests/test_nexus_v2.py
