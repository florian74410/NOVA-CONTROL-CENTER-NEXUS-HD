name: NEXUS V2.1 Full Qt Validation

on:
  push:
    branches: ["work/nexus-v2.1-shell-assets"]
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Qt system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          python -m compileall -q src tests tools
      - name: Run Qt tests
        run: python -m pytest -q tests/test_nexus_v21.py
