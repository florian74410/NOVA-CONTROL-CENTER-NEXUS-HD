name: NEXUS Control Center v2.2 panels
on:
  push:
    branches: [work/nexus-v2.2-control-center-panels]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Qt libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
      - name: Test
        run: |
          python -m pip install -e '.[test]'
          python -m compileall -q src/nova_control_center
          python -m pytest -q tests/test_control_panels.py
