name: NOVA Core v2.3 SQLite sessions
on:
  push:
    branches: [work/nexus-v2.3-config-logs-sessions]
  pull_request:
jobs:
  core:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Qt OS libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install and test
        run: |
          python -m pip install -e '.[test]'
          python -m compileall -q src tests
          python -m pytest -q tests/test_core_services.py tests/test_control_panels.py
