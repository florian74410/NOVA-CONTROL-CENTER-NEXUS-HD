name: NOVA Core connection sessions and protocol forms
on:
  push:
    branches: [work/nova-core-v24-connections-ui]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
      - run: |
          python -m pip install -e '.[test]'
          python -m compileall -q src tests
          python -m pytest -q tests/test_connection_preload.py tests/test_core_services.py tests/test_control_panels.py
