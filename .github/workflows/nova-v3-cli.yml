name: NOVA v3 CLI Launcher Kit
on:
  push:
    branches: [work/nova-v3-installer-launcher]
  pull_request:
  workflow_dispatch:
jobs:
  distro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests and build dependencies
        run: |
          python -m pip install --upgrade pip build pytest
          python -m compileall -q deploy
          python -m pytest -q tests/test_v3_distribution.py
      - name: Build NOVA Control Center wheel
        run: python -m build --wheel --outdir dist/
      - name: Linux Qt runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
      - name: CLI install integration smoke
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          WHEEL=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          DIGEST=$(sha256sum "$WHEEL" | cut -d' ' -f1)
          python deploy/nova_installer.py --root "$RUNNER_TEMP/nova-suite-smoke" install --app nova-control-center --version 3.0.0.dev0 --wheel "$WHEEL" --sha256 "$DIGEST"
          python deploy/nova_installer.py --root "$RUNNER_TEMP/nova-suite-smoke" status
          python deploy/nova_launcher.py --root "$RUNNER_TEMP/nova-suite-smoke" --status
          "$RUNNER_TEMP/nova-suite-smoke/apps/nova-control-center/current/bin/python" -c "from PySide6.QtWidgets import QApplication; from nova_control_center.nexus_v21 import MainWindow; app=QApplication([]); w=MainWindow(); assert w.windowTitle(); w.close()"
      - name: Assemble launcher kit
        run: |
          mkdir -p dist/nova-suite-v3-kit
          cp deploy/nova_installer.py deploy/nova_launcher.py deploy/nova_downloader.py deploy/bootstrap.py deploy/catalog.json dist/nova-suite-v3-kit/
          cp dist/*.whl dist/nova-suite-v3-kit/
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          kits=Path("dist/nova-suite-v3-kit")
          wheels=list(kits.glob("*.whl"))
          if len(wheels)!=1:raise RuntimeError("Exactly one wheel expected")
          wheel=wheels[0]
          (kits/"SHA256SUMS.txt").write_text(
              hashlib.sha256(wheel.read_bytes()).hexdigest()+"  "+wheel.name+"\n")
          (kits/"README.txt").write_text(
              "NOVA V3 PREVIEW KIT (not an automatic public release)\n"
              "1. python3 bootstrap.py\n"
              "2. python3 ~/.local/share/nova-suite/installer.py install "
              "--version 3.0.0.dev0 --wheel ./"+wheel.name+" "
              "--sha256 "+hashlib.sha256(wheel.read_bytes()).hexdigest()+"\n"
              "3. nova-launcher\n"
              "No public update manifest exists yet. Update checks report not configured.\n")
          PY
          cd dist
          zip -qr nova-suite-v3-kit.zip nova-suite-v3-kit
      - uses: actions/upload-artifact@v4
        with:
          name: nova-suite-v3-kit
          path: dist/nova-suite-v3-kit.zip
          retention-days: 30
