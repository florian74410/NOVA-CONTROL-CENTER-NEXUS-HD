name: Qt V1 CI

on:
  push:
    branches: ["work/nova-control-center-v1-fullqt"]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Syntax check
        run: python -m compileall -q src tests
      - name: Qt smoke tests
        run: python -m pytest -q tests/test_nexus_v1.py
