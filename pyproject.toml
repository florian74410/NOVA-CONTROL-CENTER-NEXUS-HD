[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-control-center"
version = "0.1.0"
description = "Native Linux multi-application desktop workspace"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6,<7"]

[project.optional-dependencies]
web = ["PySide6-Addons>=6.6,<7"]
test = ["pytest>=8", "pytest-qt>=4.4"]

[project.scripts]
nova-control-center = "nova_control_center.main:main"

[tool.setuptools.packages.find]
where = ["src"]
