[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-control-center"
version = "2.4.1.dev0"
description = "NEXUS HD full-Qt Linux multi-application control center"
requires-python = ">=3.10"
dependencies = ["PySide6==6.8.3"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-qt>=4.4"]

[project.scripts]
nova-control-center = "nova_control_center.nexus_v21:main"

[tool.setuptools.packages.find]
where = ["src"]
